appId: com.geopilot.app
productName: GeoPilot
copyright: Copyright © 2026 MDCL

directories:
  buildResources: build
  output: release

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!native/**/*.pyc'
  - '!native/.venv/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintrc.cjs,.prettierrc,.editorconfig,.gitignore}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{scripts,docs}/*'

# El sidecar Python se empaqueta como recurso externo (no asar) para poder
# ejecutarlo como proceso hijo. En release se usa el binario congelado por
# PyInstaller (scripts/bundle-python.sh); en dev se usa native/ + venv.
extraResources:
  - from: native/dist/geopilot-bridge/
    to: bridge/
    filter: ['**/*']
  - from: native/ubiq_bridge/
    to: bridge-src/ubiq_bridge/
    filter: ['**/*.py']

asarUnpack:
  - resources/**

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: build/icon.icns
  # Sin cuenta de desarrollador de Apple no hay notarización posible, y el
  # hardened runtime exigiría un certificado real. Con firma ad-hoc
  # (identity: null) el paquete queda coherente y macOS lo ejecuta en local.
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSLocationUsageDescription: GeoPilot muestra mapas y ubicaciones.
    LSMinimumSystemVersion: '11.0'

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  # El instalador debe desplegar el driver de Apple Mobile Device Support
  # (ver docs/WINDOWS-DRIVERS.md) — no se redistribuye aquí por licencia.

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}

linux:
  target: [AppImage]
  category: Development

publish: null
