<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>GeoPilot</title>
    <!--
      CSP estricta. `connect-src` permite las APIs de geocodificación/ruteo y
      `img-src` los tiles del mapa; nada más sale de la aplicación.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com https://server.arcgisonline.com;
               connect-src 'self' https://nominatim.openstreetmap.org https://router.project-osrm.org;
               font-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
